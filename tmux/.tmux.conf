# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── 기본 옵션 ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 10000
set -g mouse on
set -s escape-time 0          # Neovim 등에서 Esc 딜레이 제거
set -g focus-events on
set -g base-index 1           # 윈도우 번호 1부터
set -g pane-base-index 1
set -g renumber-windows on    # 윈도우 닫힐 때 번호 재정렬

# ─── 창/패인 분할 ──────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── 패인 이동 (Vi 스타일) ─────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── 패인 크기 조절 ────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── 윈도우 이동 ──────────────────────────────────────────────────────────────
bind -r p previous-window
bind -r n next-window

# ─── 복사 모드 (Vi) ────────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ─── 설정 리로드 ──────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"

# ─── 상태바 ───────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

set -g status-right-length 60
set -g status-right "#[fg=#6c7086]%Y-%m-%d  %H:%M "

set -g window-status-format " #[fg=#6c7086]#I:#W "
set -g window-status-current-format " #[bg=#313244,fg=#cdd6f4,bold]#I:#W#F "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g message-style "bg=#313244,fg=#cdd6f4"
