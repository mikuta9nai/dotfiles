# ─── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── 기본 옵션 ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 10000
set -g mouse on
set -s escape-time 0          # Neovim 등에서 Esc 딜레이 제거
set -g focus-events on
set -g base-index 1           # 윈도우 번호 1부터
set -g pane-base-index 1
set -g renumber-windows on    # 윈도우 닫힐 때 번호 재정렬
set -g set-clipboard on       # OSC52 로 터미널(Ghostty)/SSH 클립보드 연동

# ─── 창/패인 분할 ──────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── 패인/split 이동 (vim-tmux-navigator) ──────────────────────────────────────
# C-h/j/k/l 로 nvim split ↔ tmux pane 을 prefix 없이 심리스 이동.
# 실제 바인딩은 아래 TPM 의 christoomey/vim-tmux-navigator 가 담당(is_vim 자동 판정).
# 화면 지우기(C-l)는 이동에 뺏기므로 prefix + C-l 로 복구.
bind C-l send-keys 'C-l'

# ─── 패인 크기 조절 ────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── 윈도우 이동 ──────────────────────────────────────────────────────────────
bind -r p previous-window
bind -r n next-window

# ─── 복사 모드 (Vi) ────────────────────────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
# y: 선택을 시스템 클립보드(Wayland wl-copy)로. wl-copy 없으면 set-clipboard(OSC52)가 커버.
if-shell "command -v wl-copy" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'" \
  "bind -T copy-mode-vi y send -X copy-selection-and-cancel"
bind -T copy-mode-vi Escape send -X cancel

# ─── 설정 리로드 ──────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"

# ─── 상태바 ───────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#24283b,fg=#c0caf5"

set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#24283b,bold] #S #[bg=#24283b,fg=#7aa2f7]"

set -g status-right-length 60
set -g status-right "#[fg=#565f89]%Y-%m-%d  %H:%M "

set -g window-status-format " #[fg=#565f89]#I:#W "
set -g window-status-current-format " #[bg=#292e42,fg=#c0caf5,bold]#I:#W#F "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#292e42,fg=#c0caf5"

# ─── 플러그인 (TPM) ────────────────────────────────────────────────────────────
# install-bins.sh 가 ~/.tmux/plugins/tpm 로 TPM 을 클론합니다.
# 첫 실행 후 prefix(C-Space) + I 로 나머지 플러그인 설치.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 세션 영속: 15분마다 자동 저장 + tmux 시작 시 자동 복원 (재부팅해도 복구)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# TPM 초기화 — 반드시 파일 맨 마지막 줄
run '~/.tmux/plugins/tpm/tpm'
